server {
    listen 80;

    # ── AUTH SERVICE ──────────────────────────────────────
    # Tout ce qui commence par /api/profile → auth-service
    location /api/profile {
        proxy_pass http://auth-service/api/profile;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/documents {
        proxy_pass http://auth-service/api/documents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/login {
        proxy_pass http://auth-service/api/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/register {
        proxy_pass http://auth-service/api/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/logout {
        proxy_pass http://auth-service/api/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/me {
        proxy_pass http://auth-service/api/me;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/users {
        proxy_pass http://auth-service/api/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/owner/customizations {
        proxy_pass http://auth-service/api/owner/customizations;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
    
    location /api/admin/customizations {
        proxy_pass http://auth-service/api/admin/customizations;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
    # ── Feedback chat-logs ────────────────────────────────────────────────────
    # AVANT /api/agent pour éviter conflit de préfixe
    location ~ ^/api/chat-logs/([0-9]+)/feedback$ {
        proxy_pass http://auth-service/api/chat-logs/$1/feedback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    location /api/agent {
        proxy_pass http://agent-orchestrator:8006/agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # ── VEHICLE SERVICE ───────────────────────────────────
    location /api/vehicules {
        proxy_pass http://vehicle-service/api/vehicules;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/owners {
        proxy_pass http://vehicle-service/api/owners;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/owner/vehicules {
        proxy_pass http://vehicle-service/api/owner/vehicules;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
    location /api/owner {
        proxy_pass http://vehicle-service/api/owner;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/vehicles {
        proxy_pass http://vehicle-service/api/vehicles;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /storage/avatars/ {
        proxy_pass http://auth-service/storage/avatars/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /storage/ {
        proxy_pass http://vehicle-service/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /storage/agency-logos/ {
        proxy_pass http://auth-service/storage/agency-logos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── contract SERVICE ───────────────────────────────────
    location ~ ^/api/bookings/([0-9]+)/contract$ {
        proxy_pass http://booking-service/api/bookings/$1/contract;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    location /api/contracts/ {
        proxy_pass http://booking-service/api/contracts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
    # ── BOOKING SERVICE ───────────────────────────────────
    location = /api/bookings/check-reviewable {
        proxy_pass http://booking-service/api/bookings/check-reviewable;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # Route spécifique pour /my
    location = /api/bookings/my {
        proxy_pass http://booking-service/api/bookings/my;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # Route spécifique pour /owner
    location = /api/bookings/owner {
        proxy_pass http://booking-service/api/bookings/owner;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
    location /api/bookings {
        proxy_pass http://booking-service/api/bookings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization; 
        proxy_pass_header Authorization;
    }


    # ── REVIEW SERVICE ────────────────────────────────────
   
    location /api/reviews {
        proxy_pass http://review-service/api/reviews;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
    # ── OCR SERVICE ───────────────────────────────────────
    location /ocr/ {
        proxy_pass http://ocr-service:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/service-owners {
        proxy_pass http://auth-service/api/service-owners;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
 
    location /api/service-requests {
        proxy_pass http://auth-service/api/service-requests;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}