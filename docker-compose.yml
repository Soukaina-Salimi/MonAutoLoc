version: "3.8"

services:
  # ── AUTH SERVICE ──────────────────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8001:80"
    environment:
      - APP_NAME=AuthService
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - DB_HOST=db-auth
      - DB_PORT=3306
      - DB_DATABASE=db_auth
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - OCR_SERVICE_URL=http://ocr-service:8005
      - SANCTUM_STATEFUL_DOMAINS=localhost:3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.3-70b-versatile
    volumes:
      - ./auth-service:/var/www/html
      - /var/www/html/vendor
      - auth-storage:/var/www/html/storage/app/public
    depends_on:
      - db-auth
    networks:
      - plateforme-network
    restart: unless-stopped

  db-auth:
    image: mysql:8.0
    container_name: db-auth
    environment:
      MYSQL_DATABASE: db_auth
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db-auth-data:/var/lib/mysql
    networks:
      - plateforme-network
    restart: unless-stopped

  # ── VEHICLE SERVICE ───────────────────────────────────────────────────────
  vehicle-service:
    build: ./vehicle-service
    container_name: vehicle-service
    ports:
      - "8002:80"
    environment:
      - APP_NAME=VehicleService
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - DB_HOST=db-vehicle
      - DB_PORT=3306
      - DB_DATABASE=db_vehicle
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - AUTH_SERVICE_URL=http://auth-service
      - BOOKING_SERVICE_URL=http://booking-service
      - REVIEW_SERVICE_URL=http://review-service
    volumes:
      - ./vehicle-service:/var/www/html
      - /var/www/html/vendor
      - vehicle-storage:/var/www/html/storage/app/public
    depends_on:
      - db-vehicle
    networks:
      - plateforme-network
    restart: unless-stopped

  db-vehicle:
    image: mysql:8.0
    container_name: db-vehicle
    environment:
      MYSQL_DATABASE: db_vehicle
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db-vehicle-data:/var/lib/mysql
    networks:
      - plateforme-network
    restart: unless-stopped

  # ── BOOKING SERVICE ───────────────────────────────────────────────────────
  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "8003:80"
    environment:
      - APP_NAME=BookingService
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - DB_HOST=db-booking
      - DB_PORT=3306
      - DB_DATABASE=db_booking
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - AUTH_SERVICE_URL=http://auth-service
      - VEHICLE_SERVICE_URL=http://vehicle-service
      - REVIEW_SERVICE_URL=http://review-service
    volumes:
      - ./booking-service:/var/www/html
      - booking-vendor:/var/www/html/vendor
      - booking-storage:/var/www/html/storage/app
    depends_on:
      - db-booking
    networks:
      - plateforme-network
    restart: unless-stopped

  db-booking:
    image: mysql:8.0
    container_name: db-booking
    environment:
      MYSQL_DATABASE: db_booking
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db-booking-data:/var/lib/mysql
    networks:
      - plateforme-network
    restart: unless-stopped

  # ── REVIEW SERVICE ────────────────────────────────────────────────────────
  review-service:
    build: ./review-service
    container_name: review-service
    ports:
      - "8004:80"
    environment:
      - APP_NAME=ReviewService
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - DB_HOST=db-review
      - DB_PORT=3306
      - DB_DATABASE=db_review
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - AUTH_SERVICE_URL=http://auth-service
      - BOOKING_SERVICE_URL=http://booking-service
    volumes:
      - ./review-service:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - db-review
    networks:
      - plateforme-network
    restart: unless-stopped

  db-review:
    image: mysql:8.0
    container_name: db-review
    environment:
      MYSQL_DATABASE: db_review
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db-review-data:/var/lib/mysql
    networks:
      - plateforme-network
    restart: unless-stopped

  # ── OCR SERVICE ───────────────────────────────────────────────────────────
  ocr-service:
    build: ./ocr-service
    container_name: ocr-service
    ports:
      - "8005:8005"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.3-70b-versatile
    volumes:
      - ./ocr-service:/app
      - paddle_cache:/root/.paddleocr
    networks:
      - plateforme-network
    restart: unless-stopped

  agent-orchestrator:
    build: ./agent-orchestrator
    container_name: agent-orchestrator
    ports:
      - "8006:8006"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - VEHICLE_SERVICE_URL=http://vehicle-service
      - AUTH_SERVICE_URL=http://auth-service
      - BOOKING_SERVICE_URL=http://booking-service
    volumes:
      - ./agent-orchestrator:/app
    depends_on:
      - vehicle-service
      - auth-service
      - booking-service
    networks:
      - plateforme-network
    restart: unless-stopped
  # ── NGINX (API GATEWAY) ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - vehicle-service
      - booking-service
      - review-service
      - ocr-service
      - agent-orchestrator
    networks:
      - plateforme-network
    restart: unless-stopped

  # ── PHPMYADMIN ────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOSTS: db-auth,db-vehicle,db-booking,db-review
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - db-auth
      - db-vehicle
      - db-booking
      - db-review
    networks:
      - plateforme-network

  # ── FRONTEND ──────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - nginx
    networks:
      - plateforme-network
    restart: unless-stopped

# ── VOLUMES ───────────────────────────────────────────────────────────────────
volumes:
  db-auth-data:
  db-vehicle-data:
  db-booking-data:
  db-review-data:
  auth-storage:
  vehicle-storage:
  booking-storage:
  booking-vendor:

  paddle_cache:

# ── NETWORK ───────────────────────────────────────────────────────────────────
networks:
  plateforme-network:
    driver: bridge
